<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>S.O.R. — Mapa do Leitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0b1420; --tinta2:#13202f; --tinta3:#182838; --papel:#ece0c4; --papel2:#e2d3ac;
  --ambar:#b8922a; --ambar2:#d9b354; --branco:#f4efe2; --erro:#c1553c;
  --reserva-paz:#d9b354; --reservatorio:#5c7f96;
  --font-display:'Cormorant Garamond',serif; --font-manuscrita:'Caveat',cursive; --font-corpo:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font-corpo); background:var(--tinta); color:var(--branco);
  min-height:100vh; padding-bottom:96px;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
a{color:inherit;}

/* ---------- HEADER ---------- */
.header{padding:28px 20px 18px; text-align:center;}
.header .saudacao{font-family:var(--font-manuscrita); font-size:20px; color:var(--ambar2);}
.header .streak-linha{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px; font-size:13px; color:rgba(244,239,226,.5);}
.header .link-carta{
  display:inline-block; margin-top:14px; font-size:12px; letter-spacing:.02em;
  color:var(--ambar2); text-decoration:underline; opacity:.75;
}
.header .link-carta:hover{ opacity:1; }
.streak-chama{font-size:15px;}

.wrap{max-width:560px; margin:0 auto; padding:0 18px; display:flex; flex-direction:column; gap:16px;}

/* ---------- CARD BASE ---------- */
.card{
  background:var(--tinta2); border:1px solid rgba(217,179,84,.15); border-radius:6px;
  padding:20px 20px 22px;
}
.card-titulo{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:rgba(244,239,226,.45);
  font-weight:600; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;
}
.card-titulo .link-mini{font-size:11px; text-transform:none; letter-spacing:0; color:var(--ambar2); text-decoration:underline; font-weight:500;}

/* ---------- CARD: RAIO-X (M1 permanente) ---------- */
.raiox-card{
  background:linear-gradient(135deg, var(--tinta3), var(--tinta2));
  display:flex; justify-content:space-between; align-items:center; gap:14px;
}
.raiox-selo{font-family:var(--font-manuscrita); font-size:14px; color:rgba(244,239,226,.5);}
.raiox-nome{font-family:var(--font-display); font-size:20px; font-weight:600; margin-top:2px;}
.zona-pill{display:inline-block; margin-top:8px; padding:4px 10px; border-radius:2px; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;}
.zona-1{background:#c1553c; color:#fff;} .zona-2{background:var(--ambar); color:var(--tinta);} .zona-3{background:#3c6e4f; color:#fff;}
.raiox-folego{text-align:right; flex-shrink:0;}
.raiox-folego .valor{font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--ambar2);}
.raiox-folego .rotulo{font-size:10px; text-transform:uppercase; letter-spacing:.05em; opacity:.5;}

/* ---------- CARD: RESERVAS ---------- */
.reservas-row{display:flex; gap:14px;}
.reserva-item{flex:1; display:flex; align-items:center; gap:10px;}
.reserva-icone{
  width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:16px;
}
.icone-paz{background:rgba(217,179,84,.15); color:var(--reserva-paz); border:1.5px solid var(--reserva-paz);}
.icone-reservatorio{background:rgba(92,127,150,.15); color:var(--reservatorio); border:1.5px solid var(--reservatorio);}
.reserva-texto .rotulo{font-size:10px; text-transform:uppercase; letter-spacing:.04em; opacity:.5;}
.reserva-texto .valor{font-family:var(--font-display); font-size:19px; font-weight:700;}

/* ---------- TRILHA DA JORNADA (hub visual dos 4 módulos) ---------- */
.trilha{display:flex; align-items:center; justify-content:center; gap:0; padding:6px 4px 2px;}
.trilha-etapa{display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; flex:1;}
.trilha-ponto{
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:13px; border:2px solid rgba(244,239,226,.15); background:var(--tinta2); color:rgba(244,239,226,.35);
  transition:border-color .3s ease, background .3s ease, color .3s ease;
}
.trilha-ponto.feito{border-color:var(--ambar2); background:rgba(217,179,84,.15); color:var(--ambar2);}
.trilha-ponto.atual{border-color:var(--ambar2); background:var(--ambar2); color:var(--tinta); box-shadow:0 0 0 4px rgba(217,179,84,.18);}
.trilha-label{font-size:10px; color:rgba(244,239,226,.4); text-transform:uppercase; letter-spacing:.04em;}
.trilha-linha{
  position:absolute; top:15px; left:50%; width:100%; height:2px; background:rgba(244,239,226,.12); z-index:-1;
}
.trilha-linha.feito{background:var(--ambar2);}
.trilha-etapa:last-child .trilha-linha{display:none;}

/* ---------- CARD: PRÓXIMA AÇÃO ---------- */
.proxima-acao{
  background:rgba(217,179,84,.06); border:1px solid rgba(217,179,84,.3);
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.proxima-acao-texto{font-size:14px; line-height:1.5;}
.proxima-acao-texto b{color:var(--ambar2);}
.btn-mini{background:var(--ambar); color:var(--tinta); font-weight:600; font-size:13px; padding:9px 16px; border-radius:3px; flex-shrink:0; white-space:nowrap;}

/* ---------- ESTADO VAZIO (script de incentivo) ---------- */
.estado-vazio{text-align:center; padding:10px 6px;}
.estado-vazio p{font-size:14px; color:rgba(244,239,226,.6); line-height:1.6; font-style:italic;}
.contador-visual{display:flex; justify-content:center; gap:5px; margin:12px 0;}
.contador-visual span{width:22px; height:5px; border-radius:3px; background:rgba(244,239,226,.12);}
.contador-visual span.feito{background:var(--ambar2);}
.contador-legenda{font-size:12px; color:rgba(244,239,226,.4); text-align:center;}

/* ---------- CAIS (velas M3) ---------- */
.cais-vela{
  display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(244,239,226,.06);
}
.cais-vela:last-child{border-bottom:none;}
.vela-icone{width:30px; height:30px; flex-shrink:0; opacity:.85;}
.vela-nome{font-size:14px; font-weight:600;}
.vela-data{font-size:11px; color:rgba(244,239,226,.4);}

/* ---------- HISTÓRICO ---------- */
.historico-item{padding:12px 0; border-bottom:1px solid rgba(244,239,226,.06);}
.historico-item:last-child{border-bottom:none;}
.historico-tipo{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ambar2); font-weight:600;}
.historico-data{font-size:11px; color:rgba(244,239,226,.4); margin-left:8px;}
.historico-texto{font-size:13px; line-height:1.5; margin-top:4px; color:rgba(244,239,226,.75);}

/* ---------- FAB — atalho de interceptação ---------- */
.fab-interceptar{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ambar); color:var(--tinta); font-weight:700; font-size:14px;
  padding:14px 30px; border-radius:30px; box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:flex; align-items:center; gap:8px; z-index:20;
}
.fab-interceptar:active{transform:translateX(-50%) scale(.96);}

.modal-overlay{
  position:fixed; inset:0; background:rgba(11,20,32,.85); display:none; align-items:center; justify-content:center;
  z-index:50; padding:20px;
}
.modal-overlay.aberto{display:flex;}
.modal{background:var(--tinta2); border:1px solid rgba(217,179,84,.3); border-radius:8px; padding:24px; max-width:400px; width:100%; text-align:center;}
.modal p{font-size:14px; color:rgba(244,239,226,.7); line-height:1.6; margin-bottom:16px;}
.modal .btn-mini{width:100%; padding:12px;}
</style>
</head>
<body>

<div class="header">
  <div class="saudacao" id="saudacao">Bem-vindo de volta.</div>
  <div class="streak-linha" id="streakLinha"></div>
  <a href="0_hub_mapa.html" class="link-carta" id="linkCarta">ver carta de navegação →</a>
</div>

<div class="wrap">

  <!-- TRILHA — visualização da jornada nos 4 módulos -->
  <div class="card">
    <div class="trilha" id="trilhaJornada"></div>
  </div>

  <!-- CARD M1 — permanente -->
  <div class="card raiox-card" id="cardRaiox"></div>

  <!-- CARD Reserva de Paz vs Reservatório -->
  <div class="card">
    <div class="card-titulo">Suas reservas</div>
    <div class="reservas-row">
      <div class="reserva-item">
        <div class="reserva-icone icone-paz">◍</div>
        <div class="reserva-texto">
          <div class="rotulo">Reserva de Paz</div>
          <div class="valor" id="valorReservaPaz">R$ 0</div>
        </div>
      </div>
      <div class="reserva-item">
        <div class="reserva-icone icone-reservatorio">▣</div>
        <div class="reserva-texto">
          <div class="rotulo">Reservatório</div>
          <div class="valor" id="valorReservatorio">R$ 0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- CARD Próxima ação -->
  <div class="card proxima-acao" id="cardProximaAcao"></div>

  <!-- CARD M2 — Diário de Captura -->
  <div class="card">
    <div class="card-titulo">Diário de Captura</div>
    <div id="blocoM2"></div>
  </div>

  <!-- CARD M3 — Cais (velas) -->
  <div class="card">
    <div class="card-titulo">O Cais <span class="link-mini" id="linkVerCais">ver todas</span></div>
    <div id="blocoM3"></div>
  </div>

  <!-- CARD Histórico -->
  <div class="card">
    <div class="card-titulo">Histórico completo <span class="link-mini" id="linkHistorico">expandir</span></div>
    <div id="blocoHistorico"></div>
  </div>

</div>

<button class="fab-interceptar" id="btnInterceptar">
  <span>⚓</span> Interceptar
</button>

<div class="modal-overlay" id="modalPlaceholder">
  <div class="modal">
    <p id="modalTexto"></p>
    <button class="btn-mini" id="btnFecharModal">Entendi</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   LEITURA DE DADOS — hoje via localStorage (mesmas chaves/campos
   do schema Supabase, pra troca direta depois):
   - sor_m1_progress → tabelas m1_perfil / m1_raiox
   - sor_m2_capturas → tabela m2_capturas (array)
   - sor_m3_velas    → tabela m3_velas (array)
============================================================ */
function carregar(chave, padrao){
  try{ var raw = localStorage.getItem(chave); return raw ? JSON.parse(raw) : padrao; }
  catch(e){ return padrao; }
}
var m1 = carregar('sor_m1_progress', null);
var m2Capturas = carregar('sor_m2_capturas', []); // ainda não existe M2 — fica vazio até lá
var m3Velas = carregar('sor_m3_velas', []);        // idem M3

var RF = null;
try{
  // Reaproveita os textos de perfil do M1 se o mesmo navegador já rodou o quiz
  var raw = localStorage.getItem('sor_rf_cache');
  if(raw) RF = JSON.parse(raw);
}catch(e){}

/* ============================================================
   STREAK — mesma fórmula de calculos_matematica_fria.js
============================================================ */
function calcularStreak(capturas){
  if(!capturas || capturas.length===0) return {streakAtual:0};
  var diasUnicos = {};
  var menorData = null;
  capturas.forEach(function(c){
    var d = new Date(c.created_at);
    diasUnicos[d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()] = true;
    var diaSoNoDia = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if(!menorData || diaSoNoDia < menorData) menorData = diaSoNoDia;
  });
  var hoje = new Date();
  var cursor = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  var streak=0, falhas=0;
  while(true){
    var chave = cursor.getFullYear()+'-'+(cursor.getMonth()+1)+'-'+cursor.getDate();
    if(diasUnicos[chave]){ streak++; } else { falhas++; if(falhas>1) break; }
    cursor.setDate(cursor.getDate()-1);
    // Comparação por objeto Date real, não reparse de string — evita
    // falha silenciosa de parsing no Safari/iOS com datas sem zero à esquerda.
    if(menorData && cursor < menorData) break;
  }
  return {streakAtual:streak};
}
function calcularReservaDePaz(capturas){
  return (capturas||[]).filter(function(c){return c.tipo_registro==='interceptacao';})
    .reduce(function(s,c){return s+(Number(c.valor)||0);},0);
}
function fmtBRL(v){ return 'R$ ' + Math.round(Number(v)||0).toLocaleString('pt-BR'); }

/* ============================================================
   SAUDAÇÃO + STREAK (voz de mentor, camada script)
============================================================ */
var streak = calcularStreak(m2Capturas).streakAtual;
var reservaPaz = calcularReservaDePaz(m2Capturas);

var frasesSaudacao = streak > 0
  ? ['Você está há '+streak+' dia'+(streak>1?'s':'')+' seguido nisso. Isso já é diferente.']
  : (m2Capturas.length>0 ? ['Retomando. O que importa é voltar, não nunca ter parado.'] : ['O primeiro Interceptar é sempre o mais difícil. Os outros ficam mais fáceis.']);
document.getElementById('saudacao').textContent = frasesSaudacao[0];

document.getElementById('streakLinha').innerHTML = streak > 0
  ? '<span class="streak-chama">🔥</span> '+streak+' dia'+(streak>1?'s':'')+' seguidos'
  : '';

/* ============================================================
   CARD M1 — permanente, nunca recalculado
============================================================ */
function renderRaioX(){
  var card = document.getElementById('cardRaiox');
  if(!m1 || m1.cur < 18 || !m1.perfil){
    card.innerHTML =
      '<div class="estado-vazio" style="width:100%;">'+
      '<p>Você ainda não fez seu Raio-X. Sem ele, o resto do Mapa fica sem chão.</p>'+
      '</div>';
    card.style.cursor='pointer';
    card.onclick = function(){ window.location.href='carta_boas_vindas.html'; };
    return;
  }
  var nomesZona = {1:'Zona 1 — Crítica', 2:'Zona 2 — Alerta', 3:'Zona 3 — Segura'};
  var zona = (m1.dados_financeiros && m1.dados_financeiros.folego_zona) || 2;
  var folegoValor = (m1.dados_financeiros && m1.dados_financeiros.folego_valor) || '—';
  var dataRaioX = m1.concluido_em ? new Date(m1.concluido_em).toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');

  card.innerHTML =
    '<div>'+
      '<div class="raiox-selo">Raio-X inicial — '+dataRaioX+'</div>'+
      '<div class="raiox-nome">'+(RF && RF[m1.perfil] ? RF[m1.perfil].nome : 'Perfil '+m1.perfil)+'</div>'+
      '<span class="zona-pill zona-'+zona+'">'+nomesZona[zona]+'</span>'+
    '</div>'+
    '<div class="raiox-folego">'+
      '<div class="valor">'+folegoValor+'</div>'+
      '<div class="rotulo">meses de fôlego</div>'+
    '</div>';
}
renderRaioX();

/* ============================================================
   TRILHA DA JORNADA — visualização dos 4 módulos, ponto atual
   destacado. É o elemento que faz a Home funcionar como hub de
   verdade, não só uma lista de cards soltos.
============================================================ */
function renderTrilha(){
  var raioXFeito = m1 && m1.cur >= 18 && m1.perfil;
  var totalInterceptacoes = m2Capturas.filter(function(c){return c.tipo_registro==='interceptacao';}).length;
  var m3Liberado = totalInterceptacoes >= 10;
  var m3Feito = m3Velas.length > 0;
  var m4Revisoes = carregar('sor_m4_revisoes', []);
  var mesAtual = new Date().toISOString().slice(0,7);
  var m4FeitoEsteMes = m4Revisoes.some(function(r){ return (r.mes_ref||'').slice(0,7)===mesAtual; });

  var etapas = [
    {label:'Raio-X', icone:'⛵', feito: !!raioXFeito, atual: !raioXFeito, href: raioXFeito ? '' : 'carta_boas_vindas.html'},
    {label:'Diário', icone:'⚓', feito: m3Liberado, atual: raioXFeito && !m3Liberado, href:'m2_diario_de_captura.html'},
    {label:'Velas', icone:'⛱', feito: m3Feito, atual: raioXFeito && m3Liberado && !m3Feito, href:'m3_construtor_de_velas.html'},
    {label:'Revisão', icone:'📜', feito: m4FeitoEsteMes, atual: raioXFeito && m3Feito && !m4FeitoEsteMes, href:'m4_revisao_20_minutos.html'}
  ];

  var el = document.getElementById('trilhaJornada');
  el.innerHTML = etapas.map(function(e){
    var classe = e.atual ? 'atual' : (e.feito ? 'feito' : '');
    return '<div class="trilha-etapa" data-href="'+e.href+'" style="cursor:pointer;">'+
      '<div class="trilha-linha'+(e.feito?' feito':'')+'"></div>'+
      '<div class="trilha-ponto '+classe+'">'+(e.feito && !e.atual ? '✓' : e.icone)+'</div>'+
      '<div class="trilha-label">'+e.label+'</div>'+
    '</div>';
  }).join('');
  el.querySelectorAll('.trilha-etapa').forEach(function(etapa){
    var destino = etapa.getAttribute('data-href');
    if(!destino) { etapa.style.cursor = 'default'; return; }
    etapa.addEventListener('click', function(){ window.location.href = destino; });
  });
}
renderTrilha();

/* ============================================================
   RESERVAS
============================================================ */
document.getElementById('valorReservaPaz').textContent = fmtBRL(reservaPaz);
var m4RevisoesReservas = carregar('sor_m4_revisoes', []);
var reservatorioAtual = m4RevisoesReservas.length ? m4RevisoesReservas[m4RevisoesReservas.length-1].reservatorio_saldo : 0;
document.getElementById('valorReservatorio').textContent = fmtBRL(reservatorioAtual);

/* ============================================================
   PRÓXIMA AÇÃO DISPONÍVEL
============================================================ */
function renderProximaAcao(){
  var card = document.getElementById('cardProximaAcao');
  var raioXFeito = m1 && m1.cur >= 18 && m1.perfil;
  var totalInterceptacoes = m2Capturas.filter(function(c){return c.tipo_registro==='interceptacao';}).length;
  var m4Revisoes = carregar('sor_m4_revisoes', []);
  var mesAtual = new Date().toISOString().slice(0,7);
  var jaRevisouEsteMes = m4Revisoes.some(function(r){ return (r.mes_ref||'').slice(0,7)===mesAtual; });

  var texto, botao, acao;
  if(!raioXFeito){
    texto = 'Seu primeiro passo é o <b>Raio-X do Barco</b>. Leva de 3 a 5 minutos.';
    botao = 'Começar'; acao = function(){ window.location.href='carta_boas_vindas.html'; };
  } else if(totalInterceptacoes < 10){
    texto = 'Faltam <b>'+(10-totalInterceptacoes)+' registros</b> no Diário pra liberar o Construtor de Velas.';
    botao = 'Interceptar agora'; acao = abrirModalPlaceholderM2;
  } else if(m3Velas.length === 0){
    texto = 'Seu <b>Construtor de Velas</b> já pode abrir. O espelho está esperando.';
    botao = 'Abrir M3'; acao = abrirModalPlaceholderM3;
  } else if(!jaRevisouEsteMes){
    texto = 'Sua <b>Revisão dos 20 Minutos</b> deste mês ainda não foi feita.';
    botao = 'Revisar agora'; acao = function(){ window.location.href='m4_revisao_20_minutos.html'; };
  } else {
    texto = 'Tudo em dia este mês. Continue registrando no Diário.';
    botao = 'Interceptar'; acao = abrirModalPlaceholderM2;
  }
  card.innerHTML = '<div class="proxima-acao-texto">'+texto+'</div>';
  var btn = document.createElement('button');
  btn.className='btn-mini'; btn.textContent=botao; btn.onclick=acao;
  card.appendChild(btn);
}
renderProximaAcao();

/* ============================================================
   BLOCO M2 — estado vazio ou resumo
============================================================ */
function renderM2(){
  var el = document.getElementById('blocoM2');
  var total = m2Capturas.filter(function(c){return c.tipo_registro==='interceptacao';}).length;
  if(total===0){
    el.innerHTML =
      '<div class="estado-vazio">'+
      '<p>Seu barco tá pronto. Agora é hora de testá-lo na água — toque em Interceptar na próxima vez que disser não a alguma coisa.</p>'+
      '</div>';
    return;
  }
  el.innerHTML = '<div style="text-align:center;font-size:14px;">'+total+' interceptações registradas · Reserva de Paz: '+fmtBRL(reservaPaz)+'</div>';
}
renderM2();

/* ============================================================
   BLOCO M3 — Cais (estado vazio com contador visual)
============================================================ */
function renderM3(){
  var el = document.getElementById('blocoM3');
  var totalInterceptacoes = m2Capturas.filter(function(c){return c.tipo_registro==='interceptacao';}).length;

  if(m3Velas.length===0){
    if(totalInterceptacoes < 10){
      var pontos='';
      for(var i=0;i<10;i++){ pontos += '<span'+(i<totalInterceptacoes?' class="feito"':'')+'></span>'; }
      el.innerHTML =
        '<div class="estado-vazio">'+
        '<p>O espelho só se forma com registros reais. Ainda faltam algumas peças.</p>'+
        '<div class="contador-visual">'+pontos+'</div>'+
        '<div class="contador-legenda">'+totalInterceptacoes+' de 10 interceptações</div>'+
        '</div>';
    } else {
      el.innerHTML = '<div class="estado-vazio"><p>Você já tem registros suficientes. Seu Construtor de Velas está pronto pra abrir.</p></div>';
    }
    return;
  }
  el.innerHTML = m3Velas.slice(0,3).map(function(v){
    return '<div class="cais-vela"><span class="vela-icone">⛵</span>'+
      '<div><div class="vela-nome">'+v.nome_padrao+'</div>'+
      '<div class="vela-data">Ciclo '+v.ciclo_numero+' · '+new Date(v.created_at).toLocaleDateString('pt-BR')+'</div></div></div>';
  }).join('');
}
renderM3();

/* ============================================================
   HISTÓRICO COMPLETO — lista textos já gerados (M1/M3/M4)
============================================================ */
function renderHistorico(){
  var el = document.getElementById('blocoHistorico');
  var itens = [];
  if(m1 && m1.dados_financeiros && m1.dados_financeiros.veredito_ia){
    itens.push({tipo:'M1 · Veredito do Mentor', data:m1.concluido_em||new Date().toISOString(), texto:m1.dados_financeiros.veredito_ia});
  }
  m3Velas.forEach(function(v){
    itens.push({tipo:'M3 · '+v.nome_padrao, data:v.created_at, texto:v.leitura_ia});
  });
  if(itens.length===0){
    el.innerHTML = '<div class="estado-vazio"><p>Ainda não há nada registrado aqui. Cada leitura da IA — o veredito do Raio-X, os padrões do Construtor de Velas — fica guardada nesta lista conforme você avança.</p></div>';
    return;
  }
  el.innerHTML = itens.map(function(it){
    return '<div class="historico-item">'+
      '<span class="historico-tipo">'+it.tipo+'</span><span class="historico-data">'+new Date(it.data).toLocaleDateString('pt-BR')+'</span>'+
      '<div class="historico-texto">'+(it.texto||'').substring(0,140)+'…</div></div>';
  }).join('');
}
renderHistorico();

  document.getElementById('modalTexto').textContent = texto;
  document.getElementById('modalPlaceholder').classList.add('aberto');

}
function abrirModalPlaceholderM3(){

}
document.getElementById('btnInterceptar').addEventListener('click', function(){ window.location.href = 'm2_diario_de_captura.html'; });
document.getElementById('btnFecharModal').addEventListener('click', function(){
  document.getElementById('modalPlaceholder').classList.remove('aberto');
});
document.getElementById('linkVerCais').addEventListener('click', function(){
  abrirModal('Aqui abre a lista completa do Cais, agrupada por período — ainda não construída nesta sessão.');
});
document.getElementById('linkHistorico').addEventListener('click', function(){
  abrirModal('Aqui expande a lista cronológica completa de todos os textos gerados pela IA — ainda não construída nesta sessão.');
});

})();
